[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-switcher"
version = "0.1.0"
description = "Reproducible momentum versus mean-reversion regime backtest"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
regime-switcher = "regime_switcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
